<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Shooter - Piloto Arthur</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body {
      margin: 0;
      padding: 0;
      background: #050510;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      border: 2px solid #33f;
      box-shadow: 0 0 15px rgba(51, 51, 255, 0.5);
      background: #000;
      max-width: 100vw;
      max-height: 70vh;
    }
    
    /* Controles para Celular */
    .touch-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      margin-top: 15px;
      padding: 0 10px;
    }
    .d-pad {
      display: flex;
      gap: 10px;
    }
    .btn-touch {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid #fff;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      padding: 15px 25px;
      border-radius: 12px;
      active-bg: rgba(255, 255, 255, 0.5);
    }
    .btn-fire {
      background: rgba(255, 0, 0, 0.4);
      border-color: #f00;
      padding: 15px 30px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <!-- Controles de Toque para Celular -->
    <div class="touch-controls">
      <div class="d-pad">
        <button class="btn-touch" id="btnLeft">⬅️</button>
        <button class="btn-touch" id="btnRight">➡️</button>
      </div>
      <button class="btn-touch btn-fire" id="btnFire">🚀 ATIRAR</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let gameOver = false;
    let pilotName = "ARTHUR";

    const player = {
      x: canvas.width / 2 - 15,
      y: canvas.height - 50,
      width: 30,
      height: 30,
      speed: 5,
      dx: 0
    };

    const bullets = [];
    const enemies = [];

    // --- Controles de Teclado (PC) ---
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') player.dx = -player.speed;
      if (e.key === 'ArrowRight') player.dx = player.speed;
      if (e.key === ' ' && !gameOver) shoot();
      if ((e.key === 'r' || e.key === 'R') && gameOver) restartGame();
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') player.dx = 0;
    });

    // --- Controles de Toque (Celular) ---
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnFire = document.getElementById('btnFire');

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); player.dx = -player.speed; });
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); player.dx = 0; });

    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); player.dx = player.speed; });
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); player.dx = 0; });

    btnFire.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameOver) restartGame();
      else shoot();
    });

    function shoot() {
      bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 10, speed: 7 });
    }

    function spawnEnemy() {
      if (gameOver) return;
      const x = Math.random() * (canvas.width - 30);
      enemies.push({ x: x, y: -30, width: 30, height: 30, speed: 2 + Math.random() * 2 });
    }
    setInterval(spawnEnemy, 1000);

    function update() {
      if (gameOver) return;

      player.x += player.dx;
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      bullets.forEach((b, index) => {
        b.y -= b.speed;
        if (b.y < 0) bullets.splice(index, 1);
      });

      enemies.forEach((enemy, eIndex) => {
        enemy.y += enemy.speed;

        if (
          player.x < enemy.x + enemy.width &&
          player.x + player.width > enemy.x &&
          player.y < enemy.y + enemy.height &&
          player.y + player.height > enemy.y
        ) {
          gameOver = true;
        }

        bullets.forEach((bullet, bIndex) => {
          if (
            bullet.x < enemy.x + enemy.width &&
            bullet.x + bullet.width > enemy.x &&
            bullet.y < enemy.y + enemy.height &&
            bullet.y + bullet.height > enemy.y
          ) {
            enemies.splice(eIndex, 1);
            bullets.splice(bIndex, 1);
            score += 10;
          }
        });

        if (enemy.y > canvas.height) enemies.splice(eIndex, 1);
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Jogador
      ctx.fillStyle = '#00f';
      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.fill();

      // Tiros
      ctx.fillStyle = '#0f0';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      // Inimigos
      ctx.fillStyle = '#f00';
      enemies.forEach(e => ctx.fillRect(e.x, e.y, e.width, e.height));

      // HUD Nome do Piloto e Pontos
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.fillText(`PILOTO: ${pilotName}`, 10, 25);
      ctx.fillText(`PONTOS: ${score}`, 10, 45);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff3333';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.fillText(`Pontuação do Arthur: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillText('Toque em ATIRAR para reiniciar', canvas.width / 2, canvas.height / 2 + 60);
        ctx.textAlign = 'left';
      }
    }

    function restartGame() {
      score = 0;
      bullets.length = 0;
      enemies.length = 0;
      player.x = canvas.width / 2 - 15;
      gameOver = false;
      loop();
    }

    function loop() {
      update();
      draw();
      if (!gameOver) requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
